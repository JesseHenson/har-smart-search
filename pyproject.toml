[project]
name = "har-search"
version = "0.8.1"
description = "Similarity search and comps valuation over HAR listings"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2,<3",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/har_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The `error` half is the point. With one known third-party warning tolerated
# and everything else fatal, a NEW warning becomes a test failure rather than
# a line nobody reads. Do not broaden this list to silence our own warnings.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
